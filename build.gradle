plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "archery-revamped" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "Ladysnake Libs"
        url = "https://maven.ladysnake.org/releases"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional UI integrations. They are present in the development client,
    // but remain optional for players using the published mod.
    implementation "maven.modrinth:9s6osm5g:GFM8zh9J" // Cloth Config 26.1.154+fabric
    implementation "maven.modrinth:mOgUt4GM:3rsoV1bk" // Mod Menu 18.0.0 for 26.1
    compileOnly "maven.modrinth:XaT8sLP6:DHE2OnLP" // Trinkets Updated 3.11.0-beta.2+1.21.11
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:7.3.0"
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:7.3.0"
}

// The published 1.21.11 Trinkets Updated binary is Yarn-mapped and cannot be
// loaded by a Mojang-mapped 26.1 build. Villager trades are also being moved
// away from Fabric's removed TradeOfferHelper API in a later migration slice.
// Keep both integrations out of this first, testable core baseline.
sourceSets {
    main {
        java {
            exclude 'me/lemonboi439/archeryRevamped/compat/**'
            exclude 'me/lemonboi439/archeryRevamped/trade/**'
        }
    }
    client {
        java {
            // These use the 1.21.11 GUI extraction and Fabric rendering APIs.
            // They return in a dedicated client/UI migration slice after the
            // basic custom projectile client is verified on 26.1.
            exclude 'me/lemonboi439/archeryRevamped/client/QuiverScreen.java'
            exclude 'me/lemonboi439/archeryRevamped/client/OverdrawClientHandler.java'
            exclude 'me/lemonboi439/archeryRevamped/mixin/CameraMixin.java'
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
